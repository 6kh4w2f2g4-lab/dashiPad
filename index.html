html = r'''<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Münster">
<meta name="theme-color" content="#000000">
<title>Münster</title>
<style>
:root{
  color-scheme:dark;
  --bg:#000000;
  --card:#1C1C1E;
  --card-secondary:#2C2C2E;
  --ink:#F5F5F7;
  --soft:#98989D;
  --line:rgba(255,255,255,.10);
  --blue:#0A84FF;
  --green:#30D158;
  --orange:#FF9F0A;
  --red:#FF453A;
  --shadow:0 10px 30px rgba(0,0,0,.34),0 2px 8px rgba(0,0,0,.22);
}
*{box-sizing:border-box}
html{height:100%;background:var(--bg)}
body{
  min-height:100%;
  margin:0;
  padding:20px 24px 14px;
  background:
    radial-gradient(ellipse at 18% 0%,rgba(10,132,255,.10),transparent 38%),
    radial-gradient(ellipse at 100% 100%,rgba(48,209,88,.045),transparent 34%),
    var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  text-align:left;
}
.dashboard{
  width:100%;
  max-width:1440px;
  min-height:calc(100vh - 34px);
  margin:0 auto;
  display:grid;
  grid-template-columns:minmax(220px,.9fr) minmax(360px,1.55fr) minmax(250px,1fr);
  grid-template-rows:minmax(210px,.88fr) minmax(260px,1.12fr);
  grid-template-areas:
    "clock weather weather"
    "trains drive radio";
  gap:16px;
}
.card{
  min-width:0;
  min-height:0;
  padding:20px;
  border-radius:22px;
  background:linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,0) 42%),var(--card);
  border:1px solid var(--line);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.035);
  overflow:hidden;
}
.clock-card{
  grid-area:clock;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:flex-start;
  background:linear-gradient(145deg,rgba(10,132,255,.15),rgba(28,28,30,.96) 68%);
}
.time{
  font-size:clamp(66px,8vw,112px);
  line-height:.98;
  letter-spacing:-5px;
  font-weight:650;
  font-variant-numeric:tabular-nums;
  color:#fff;
  white-space:nowrap;
}
.date{
  margin-top:12px;
  color:var(--soft);
  font-size:clamp(16px,1.8vw,21px);
  font-weight:500;
}
.weather-card{grid-area:weather;display:flex;flex-direction:column;justify-content:center}
.card-heading{
  margin:0 0 16px;
  color:var(--soft);
  font-size:13px;
  line-height:1.2;
  font-weight:650;
  letter-spacing:.09em;
  text-transform:uppercase;
}
.row{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  width:100%;
  gap:8px;
}
.slot{
  min-width:0;
  min-height:140px;
  margin:0;
  padding:13px 8px;
  border:1px solid rgba(255,255,255,.055);
  border-radius:16px;
  background:rgba(255,255,255,.035);
  text-align:center;
}
.slot.now{
  border-color:rgba(10,132,255,.42);
  background:rgba(10,132,255,.11);
}
.lbl{font-size:14px;color:var(--soft);font-weight:550}
.now .lbl{color:#64B5FF;font-weight:650}
.ic{font-size:31px;margin:12px 0 7px;line-height:1}
.t{font-size:clamp(23px,2.5vw,34px);font-weight:700;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.c{font-size:13px;color:var(--soft);margin-top:7px}
.p{font-size:12px;color:#64B5FF;margin-top:10px;font-weight:600}
.train-card{grid-area:trains}
.drive-card{grid-area:drive}
.train-card,.drive-card{display:flex;flex-direction:column;justify-content:flex-start}
.trains{
  width:100%;
  max-width:none;
  margin:0;
  padding:0;
  border:0;
  text-align:left;
}
.th{
  margin:0 0 17px;
  color:var(--soft);
  font-size:13px;
  line-height:1.25;
  font-weight:650;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.tr{
  display:grid;
  grid-template-columns:58px 44px minmax(58px,1fr);
  grid-template-areas:"time line track" "arr arr status";
  align-items:center;
  gap:3px 9px;
  padding:10px 0;
  margin:0;
  border-top:1px solid rgba(255,255,255,.07);
}
.tt{grid-area:time;width:auto;font-size:25px;font-weight:700;letter-spacing:-.7px;font-variant-numeric:tabular-nums}
.tl{grid-area:line;width:auto;font-size:15px;font-weight:650;color:#fff}
.tg{grid-area:track;width:auto;font-size:12px;font-weight:550;color:var(--soft)}
.ta{grid-area:arr;width:auto;font-size:12px;color:var(--soft)}
.ts{grid-area:status;justify-self:start;font-size:12px;font-weight:650;color:var(--green)}
.ts.late{color:var(--orange)}
.ts.bad{color:var(--red)}
.ts.plan{color:var(--soft);font-weight:500}
.tmsg{font-size:14px;line-height:1.45;color:var(--soft)}
.dr{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px 14px;padding:14px 0;border-top:1px solid rgba(255,255,255,.07)}
.dt{width:auto;font-size:clamp(35px,4vw,52px);font-weight:750;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.dd{width:auto;font-size:15px;color:var(--soft)}
.drive-card .ts{font-size:13px}
.radio-card{
  grid-area:radio;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
}
.radio{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  width:100%;
  max-width:none;
  margin:0;
}
.rb{
  min-width:0;
  min-height:54px;
  padding:10px 9px;
  border:1px solid rgba(255,255,255,.10);
  border-radius:14px;
  background:var(--card-secondary);
  color:var(--ink);
  font:650 14px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
  white-space:normal;
  -webkit-appearance:none;
  appearance:none;
  -webkit-tap-highlight-color:transparent;
  transition:background-color .15s ease,border-color .15s ease,transform .15s ease,opacity .15s ease;
  touch-action:manipulation;
}
.rb:active,#gear:active,#setup button:active{transform:scale(.97);opacity:.78}
.rb.on{
  background:var(--blue);
  border-color:var(--blue);
  color:#fff;
  box-shadow:0 4px 14px rgba(10,132,255,.25);
}
.rb.wait{opacity:.65}
.rb:disabled{opacity:.55}
#air{
  grid-column:1/-1;
  color:#64B5FF;
  background:rgba(10,132,255,.10);
  border-color:rgba(10,132,255,.30);
}
#foot{
  display:flex;
  flex-direction:column;
  gap:9px;
  margin-top:auto;
  padding-top:18px;
  color:var(--soft);
  font-size:12px;
  line-height:1.4;
}
#rmsg{min-height:17px;margin:0}
#gear{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  align-self:flex-start;
  min-height:44px;
  padding:0 13px;
  margin:0;
  border:1px solid rgba(255,255,255,.10);
  border-radius:12px;
  background:rgba(255,255,255,.055);
  color:#64B5FF;
  font-size:14px;
  font-weight:600;
  text-decoration:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
#stand{
  margin-top:12px;
  color:var(--soft);
  font-size:11px;
  line-height:1.35;
}
#player{display:none}

/* Einstellungs-Modal im iPadOS-Glass-Stil */
#setup{
  display:none;
  position:fixed;
  inset:0;
  z-index:10;
  padding:24px;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.52);
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
}
#setup .box{
  width:100%;
  max-width:520px;
  padding:28px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:24px;
  background:rgba(44,44,46,.88);
  -webkit-backdrop-filter:blur(25px) saturate(180%);
  backdrop-filter:blur(25px) saturate(180%);
  box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);
  text-align:left;
}
#setup h1{margin:0 0 8px;font-size:27px;letter-spacing:-.7px;font-weight:700}
#setup p{margin:0 0 22px;color:var(--soft);font-size:14px;line-height:1.45}
#setup label{display:block;margin:15px 0 7px;color:#D1D1D6;font-size:13px;font-weight:600}
#setup input{
  width:100%;
  min-height:48px;
  padding:11px 13px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px;
  outline:none;
  background:#1C1C1E;
  color:var(--ink);
  font:16px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
}
#setup input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(10,132,255,.18)}
#setup button{
  min-height:48px;
  width:100%;
  margin-top:22px;
  padding:11px 20px;
  border:0;
  border-radius:13px;
  background:var(--blue);
  color:#fff;
  font:650 16px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
  -webkit-appearance:none;
  appearance:none;
  touch-action:manipulation;
}
#fmsg{margin-top:12px;color:var(--red);font-size:13px;line-height:1.4}

@media (max-width:900px){
  body{padding:14px}
  .dashboard{
    min-height:calc(100vh - 28px);
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    grid-template-rows:auto auto auto;
    grid-template-areas:
      "clock weather"
      "trains drive"
      "radio radio";
    gap:12px;
  }
  .card{padding:17px}
  .weather-card{min-height:200px}
  .radio-card{min-height:170px}
  #foot{padding-top:12px}
}
@media (orientation:portrait){
  body{padding:12px}
  .dashboard{
    min-height:0;
    grid-template-columns:minmax(0,1fr);
    grid-template-rows:auto;
    grid-template-areas:"clock" "weather" "trains" "drive" "radio";
    gap:11px;
  }
  .clock-card{min-height:155px}
  .time{font-size:76px;letter-spacing:-3px}
  .weather-card{min-height:190px}
  .row{gap:5px}
  .slot{min-height:130px;padding:11px 4px}
  .ic{font-size:26px;margin:10px 0 6px}
  .t{font-size:25px}
  .lbl{font-size:12px}
  .c{font-size:11px}
  .p{font-size:10px}
  .train-card,.drive-card{min-height:145px}
  .radio-card{min-height:210px}
  .radio{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-height:700px) and (orientation:landscape){
  body{padding:10px 16px}
  .dashboard{
    min-height:calc(100vh - 20px);
    grid-template-rows:minmax(170px,.8fr) minmax(230px,1.2fr);
    gap:10px;
  }
  .card{padding:15px}
  .time{font-size:76px}
  .date{margin-top:7px;font-size:16px}
  .slot{min-height:116px;padding:9px 5px}
  .ic{font-size:25px;margin:8px 0 5px}
  .t{font-size:25px}
  .th{margin-bottom:10px}
  .tr{padding:7px 0}
  #foot{padding-top:8px}
  #stand{margin-top:7px}
}
</style>
</head>
<body>
<main class="dashboard">
  <section class="card clock-card" aria-label="Uhrzeit und Datum">
    <div class="time" id="time">--:--</div>
    <div class="date" id="date"></div>
  </section>

  <section class="card weather-card" aria-label="Wetter">
    <h2 class="card-heading">Wetter · Münster</h2>
    <div class="row" id="row">
      <div class="slot now"><div class="lbl">Wetter wird geladen …</div></div>
    </div>
  </section>

  <section class="card train-card" aria-label="Zugverbindungen">
    <div class="trains">
      <div class="th">Münster Hbf nach Rheine</div>
      <div id="trains"><div class="tmsg">Verbindungen werden geladen …</div></div>
    </div>
  </section>

  <section class="card drive-card" aria-label="Autoverkehr">
    <div class="trains">
      <div class="th">Auto von Münster nach Ascheberg</div>
      <div id="drive"><div class="tmsg">Verkehrslage wird geladen …</div></div>
    </div>
  </section>

  <section class="card radio-card" aria-label="Radio">
    <h2 class="card-heading">Radio</h2>
    <div class="radio" id="radio"></div>
    <audio id="player" preload="none" playsinline x-webkit-airplay="allow" airplay="allow"></audio>
    <div id="foot">
      <span id="rmsg"></span>
      <span id="gear" onclick="openSetup()" role="button" tabindex="0">Einstellungen</span>
    </div>
  </section>
</main>

<div id="stand"></div>

<div id="setup">
  <div class="box">
    <h1>Einstellungen</h1>
    <p>Diese Angaben werden nur auf diesem iPad gespeichert, nicht in der Seite selbst.</p>
    <label for="fk">TomTom-API-Schlüssel</label>
    <input id="fk" type="text" autocapitalize="off" autocorrect="off">
    <label for="ff">Startadresse (Auto)</label>
    <input id="ff" type="text">
    <label for="ft">Zieladresse (Auto)</label>
    <input id="ft" type="text">
    <button onclick="saveSetup()">Speichern</button>
    <div id="fmsg"></div>
  </div>
</div>

<script>''' + js + r'''</script>
</body>
</html>
