<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Münster">
<title>Münster</title>
<style>
:root {
  --bg: #000000;
  --surface: #1c1c1e;
  --surface-hover: #2c2c2e;
  --ink: #ffffff;
  --soft: #8e8e93;
  --line: rgba(255, 255, 255, 0.12);
  --sea: #0a84ff;       /* Apple System Blue */
  --late: #ff9f0a;      /* Apple System Orange */
  --bad: #ff453a;       /* Apple System Red */
  --success: #30d158;   /* Apple System Green */
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 32px;
  overflow-x: hidden;
}

.time {
  font-size: 88px;
  font-weight: 700;
  letter-spacing: -2px;
  line-height: 1.1;
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
}

.date {
  font-size: 20px;
  font-weight: 500;
  color: var(--soft);
  margin: 4px 0 20px;
  text-transform: capitalize;
}

.row {
  display: flex;
  width: 100%;
  max-width: 960px;
  gap: 12px;
  margin-bottom: 16px;
}

.slot {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 16px 8px;
  text-align: center;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
}

.slot.now {
  border-color: var(--sea);
  background: rgba(10, 132, 255, 0.08);
}

.lbl {
  font-size: 15px;
  font-weight: 500;
  color: var(--soft);
  margin-bottom: 6px;
}

.now .lbl {
  color: var(--sea);
  font-weight: 600;
}

.ic {
  font-size: 36px;
  margin: 6px 0;
}

.t {
  font-size: 30px;
  font-weight: 600;
  line-height: 1;
}

.c {
  font-size: 14px;
  color: var(--soft);
  margin-top: 6px;
}

.p {
  font-size: 15px;
  color: var(--sea);
  margin-top: 6px;
  font-weight: 500;
}

.trains {
  width: 100%;
  max-width: 960px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  text-align: left;
}

.th {
  font-size: 18px;
  font-weight: 600;
  color: var(--soft);
  margin-bottom: 14px;
  letter-spacing: -0.3px;
}

.tr, .dr {
  display: flex;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}

.tr:last-child, .dr:last-child {
  border-bottom: none;
  padding-bottom: 0;
}

.tr:first-of-type, .dr:first-of-type {
  padding-top: 0;
}

.tt, .dt {
  width: 130px;
  font-size: 26px;
  font-weight: 600;
}

.tl, .dd {
  width: 130px;
  font-size: 18px;
  color: var(--soft);
}

.tg {
  width: 130px;
  font-size: 18px;
  font-weight: 500;
}

.ta {
  width: 180px;
  font-size: 18px;
  color: var(--soft);
}

.ts {
  font-size: 15px;
  font-weight: 600;
  padding: 6px 12px;
  border-radius: 8px;
  background: rgba(48, 209, 88, 0.15);
  color: var(--success);
}

.ts.late {
  background: rgba(255, 159, 10, 0.15);
  color: var(--late);
}

.ts.bad {
  background: rgba(255, 69, 58, 0.15);
  color: var(--bad);
}

.ts.plan {
  background: rgba(142, 142, 147, 0.15);
  color: var(--soft);
  font-weight: 400;
}

.tmsg {
  font-size: 16px;
  color: var(--soft);
  padding: 10px 0;
}

.radio {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  width: 100%;
  max-width: 960px;
  margin-bottom: 16px;
}

.rb {
  flex: 1 1 145px;
  min-height: 52px;
  padding: 12px 16px;
  font: 600 16px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  transition: all 0.2s ease;
  -webkit-appearance: none;
  appearance: none;
}

.rb:hover {
  background: var(--surface-hover);
}

.rb.on {
  background: var(--sea);
  border-color: var(--sea);
  color: #fff;
}

.rb.wait { opacity: 0.65; }
.rb:disabled { opacity: 0.55; }

#air {
  color: var(--sea);
  flex: 0 1 145px;
}

#foot {
  width: 100%;
  max-width: 960px;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  font-size: 14px;
  color: var(--soft);
  margin-top: 4px;
  padding: 0 4px;
}

#rmsg { margin-right: auto; }

#gear {
  color: var(--sea);
  text-decoration: none;
  cursor: pointer;
  font-weight: 500;
}
#gear:hover { text-decoration: underline; }

#stand {
  font-size: 13px;
  color: var(--soft);
  margin-top: 12px;
  max-width: 960px;
  text-align: center;
}

#setup {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  padding: 40px;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 100;
}

#setup .box {
  width: 100%;
  max-width: 520px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 32px;
  text-align: left;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
}

#setup h1 {
  font-size: 24px;
  font-weight: 700;
  margin: 0 0 8px;
  color: var(--ink);
}

#setup p {
  font-size: 15px;
  color: var(--soft);
  margin: 0 0 24px;
  line-height: 1.4;
}

#setup label {
  display: block;
  font-size: 14px;
  font-weight: 500;
  margin: 16px 0 6px;
  color: var(--soft);
}

#setup input {
  width: 100%;
  font-size: 17px;
  padding: 12px 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.05);
  color: var(--ink);
  outline: none;
  transition: border-color 0.2s;
}

#setup input:focus {
  border-color: var(--sea);
}

#setup button {
  width: 100%;
  font-size: 17px;
  font-weight: 600;
  padding: 14px;
  margin-top: 24px;
  border: 0;
  border-radius: 12px;
  background: var(--sea);
  color: #fff;
  cursor: pointer;
  transition: opacity 0.2s;
}

#setup button:active { opacity: 0.8; }

#fmsg {
  font-size: 14px;
  color: var(--bad);
  margin-top: 12px;
  text-align: center;
}

@media (orientation: portrait) {
  .time { font-size: 76px; }
  .ic { font-size: 32px; }
  .t { font-size: 26px; }
  .lbl { font-size: 14px; }
  .p { font-size: 14px; }
  .c { font-size: 13px; }
  .tt, .dt { width: 100px; font-size: 22px; }
  .tl, .dd { width: 90px; font-size: 15px; }
  .tg { width: 80px; font-size: 15px; }
  .ta { width: 120px; font-size: 15px; }
  .ts { font-size: 13px; }
}
</style>
</head>
<body>

<div class="time" id="time">--:--</div>
<div class="date" id="date"></div>
<div class="row" id="row"><div class="slot now"><div class="lbl">Wetter wird geladen …</div></div></div>

<div class="trains">
  <div class="th">Münster Hbf nach Rheine</div>
  <div id="trains"><div class="tmsg">Verbindungen werden geladen …</div></div>
</div>

<div class="trains">
  <div class="th">Auto von Münster nach Ascheberg</div>
  <div id="drive"><div class="tmsg">Verkehrslage wird geladen …</div></div>
</div>

<div class="radio" id="radio"></div>
<audio id="player" preload="none" playsinline x-webkit-airplay="allow" airplay="allow"></audio>
<div id="stand"></div>

<div id="foot">
  <span id="rmsg"></span>
  <span id="gear" onclick="openSetup()">Einstellungen</span>
</div>

<div id="setup">
<div class="box">
  <h1>Einstellungen</h1>
  <p>Diese Angaben werden nur auf diesem iPad gespeichert, nicht in der Seite selbst.</p>
  <label for="fk">TomTom-API-Schlüssel</label>
  <input id="fk" type="text" autocapitalize="off" autocorrect="off">
  <label for="ff">Startadresse (Auto)</label>
  <input id="ff" type="text">
  <label for="ft">Zieladresse (Auto)</label>
  <input id="ft" type="text">
  <button onclick="saveSetup()">Speichern</button>
  <div id="fmsg"></div>
</div>
</div>

<script>
// ===== Einstellungen =====
var LAT = 51.96, LON = 7.63;
var API = "https://api.transitous.org/api";
var FROM_TEXT = "Münster Hbf", TO_TEXT = "Rheine Bahnhof";
// =========================

var WX = [[0,"Klar","☀️"],[2,"Heiter","🌤️"],[3,"Bedeckt","☁️"],[48,"Nebel","🌫️"],[57,"Nieselregen","🌦️"],[67,"Regen","🌧️"],[77,"Schnee","❄️"],[82,"Schauer","🌦️"],[86,"Schneeschauer","🌨️"],[99,"Gewitter","⛈️"]];
var IDS = {}, TRAINS = null;

function $(id){return document.getElementById(id)}
function hm(d){return d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}
function wx(c){for(var i=0;i<WX.length;i++){if(c<=WX[i][0])return WX[i]}return WX[0]}

function tick(){
  var n=new Date();
  $("time").textContent=hm(n);
  $("date").textContent=n.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
  renderTrains();
}

/* ---------- Wetter ---------- */
function slot(label,w,temp,rain,isNow){
  return '<div class="slot'+(isNow?' now':'')+'"><div class="lbl">'+label+'</div><div class="ic">'+w[2]+'</div><div class="t">'+temp+'°</div><div class="c">'+w[1]+'</div><div class="p">💧 '+rain+' %</div></div>';
}

function loadWeather(){
  fetch("https://api.open-meteo.com/v1/forecast?latitude="+LAT+"&longitude="+LON+"&current_weather=true&hourly=temperature_2m,weathercode,precipitation_probability&timezone=auto&forecast_days=2")
  .then(function(r){return r.json()})
  .then(function(d){
    var c=d.current_weather,H=d.hourly,hrs=H.time,idx=0,i,j,k,h="",start;
    for(i=0;i<hrs.length;i++){if(hrs[i].slice(0,13)===c.time.slice(0,13)){idx=i;break}}
    h+=slot("Jetzt",wx(c.weathercode),Math.round(c.temperature),H.precipitation_probability[idx],true);
    start=idx+2+(new Date().getMinutes()>0?1:0);
    for(k=0;k<4;k++){
      j=start+2*k;
      if(j>=hrs.length)break;
      h+=slot(hrs[j].slice(11,16),wx(H.weathercode[j]),Math.round(H.temperature_2m[j]),H.precipitation_probability[j],false);
    }
    $("row").innerHTML=h;
    $("stand").textContent="💧 = Niederschlagswahrscheinlichkeit. Wetter aktualisiert um "+hm(new Date())+". Zugdaten: Transitous, transitous.org/sources";
  })
  .catch(function(){
    $("row").innerHTML='<div class="slot now"><div class="lbl">Wetter nicht erreichbar. Prüfe die Internetverbindung des iPads.</div></div>';
  });
}

/* ---------- Züge ---------- */
function stopId(text,must){
  if(IDS[text])return Promise.resolve(IDS[text]);
  return fetch(API+"/v1/geocode?text="+encodeURIComponent(text)+"&type=STOP")
  .then(function(r){if(!r.ok)throw new Error("Haltestellensuche "+r.status);return r.json()})
  .then(function(l){
    var a=l.filter(function(x){return x.name&&x.name.indexOf(must)===0});
    var b=a.filter(function(x){return /Hbf|Bahnhof/.test(x.name)});
    var h=b[0]||a[0];
    if(!h)throw new Error("Haltestelle nicht gefunden: "+text);
    IDS[text]=h.id;
    return h.id;
  });
}

function trainRow(t){
  var st;
  if(t.cancelled)st='<span class="ts bad">fällt aus</span>';
  else if(!t.live)st='<span class="ts plan">Fahrplan</span>';
  else st=t.delay>0?'<span class="ts late">+'+t.delay+' Min</span>':'<span class="ts">pünktlich</span>';
  return '<div class="tr"><span class="tt">'+hm(t.dep)+'</span><span class="tl">'+t.line+'</span><span class="tg">'+"Gleis "+(t.track||"–")+'</span><span class="ta">an '+hm(t.arr)+'</span>'+st+'</div>';
}

function renderTrains(){
  if(!TRAINS)return;
  var now=Date.now();
  var list=TRAINS.filter(function(t){return t.dep.getTime()>=now-30000}).slice(0,3);
  $("trains").innerHTML=list.length?list.map(trainRow).join(""):'<div class="tmsg">Keine direkte Verbindung in Sicht.</div>';
}

function loadTrains(){
  Promise.all([stopId(FROM_TEXT,"Münster"),stopId(TO_TEXT,"Rheine")])
  .then(function(ids){
    return fetch(API+"/v6/plan?fromPlace="+encodeURIComponent(ids[0])+"&toPlace="+encodeURIComponent(ids[1])+"&numItineraries=8&maxTransfers=0");
  })
  .then(function(r){if(!r.ok)throw new Error("Verbindungssuche "+r.status);return r.json()})
  .then(function(d){
    var out=[];
    (d.itineraries||[]).forEach(function(it){
      var legs=it.legs.filter(function(l){return l.mode!=="WALK"&&l.mode!=="BIKE"&&l.mode!=="CAR"});
      if(legs.length!==1||!/RAIL|TRAIN|LONG_DISTANCE|SUBURBAN/i.test(legs[0].mode))return;
      var l=legs[0],dl=Math.round((new Date(l.startTime)-new Date(l.scheduledStartTime))/60000);
      out.push({
        dep:new Date(l.startTime),arr:new Date(l.endTime),
        delay:isNaN(dl)?0:dl,live:!!l.realTime,cancelled:!!l.cancelled,
        line:l.routeShortName||l.displayName||"Zug",
        track:(l.from&&(l.from.track||l.from.scheduledTrack))||""
      });
    });
    out.sort(function(x,y){return x.dep-y.dep});
    TRAINS=out;
    renderTrains();
  })
  .catch(function(e){
    if(!TRAINS)$("trains").innerHTML='<div class="tmsg">Zugdaten nicht erreichbar ('+(e&&e.message?e.message:"Fehler")+'). Die Seite versucht es automatisch erneut.</div>';
  });
}

/* ---------- Autoverkehr ---------- */
var CFGD = null;

function loadCfg(){
  try{CFGD=JSON.parse(localStorage.getItem("dash.cfg")||"null")}
  catch(e){CFGD=null}
}

function saveCfg(c){
  CFGD=c;
  try{localStorage.setItem("dash.cfg",JSON.stringify(c))}
  catch(e){}
}

function openSetup(){
  $("fk").value=CFGD?CFGD.key:"";
  $("ff").value=CFGD?CFGD.from:"";
  $("ft").value=CFGD?CFGD.to:"";
  $("fmsg").textContent="";
  $("setup").style.display="flex";
}

function saveSetup(){
  var c={key:$("fk").value.trim(),from:$("ff").value.trim(),to:$("ft").value.trim()};
  if(!c.key||!c.from||!c.to){
    $("fmsg").textContent="Bitte alle drei Felder ausfüllen.";
    return;
  }
  saveCfg(c);
  $("setup").style.display="none";
  loadDrive();
}

function geocode(q,key){
  return fetch("https://api.tomtom.com/search/2/geocode/"+encodeURIComponent(q)+".json?key="+encodeURIComponent(key)+"&countrySet=DE&limit=1")
  .then(function(r){if(!r.ok)throw new Error("Adresssuche "+r.status);return r.json()})
  .then(function(d){
    var x=d.results&&d.results[0];
    if(!x)throw new Error("Adresse nicht gefunden: "+q);
    return x.position.lat+","+x.position.lon;
  });
}

function loadDrive(){
  var c=CFGD;
  if(!c||!c.key){
    $("drive").innerHTML='<div class="tmsg">Noch nicht eingerichtet. Tippe unten auf „Einstellungen".</div>';
    return;
  }
  Promise.all([c.fp?Promise.resolve(c.fp):geocode(c.from,c.key),c.tp?Promise.resolve(c.tp):geocode(c.to,c.key)])
  .then(function(p){
    if(!c.fp||!c.tp){c.fp=p[0];c.tp=p[1];saveCfg(c)}
    return fetch("https://api.tomtom.com/routing/1/calculateRoute/"+p[0]+":"+p[1]+"/json?key="+encodeURIComponent(c.key)+"&traffic=true&travelMode=car&routeType=fastest&routeRepresentation=summaryOnly");
  })
  .then(function(r){if(!r.ok)throw new Error("Routenberechnung "+r.status);return r.json()})
  .then(function(d){
    var s=d.routes[0].summary,min=Math.round(s.travelTimeInSeconds/60),dl=Math.round((s.trafficDelayInSeconds||0)/60),km=Math.round(s.lengthInMeters/1000),st;
    if(dl<=2)st='<span class="ts">freie Fahrt</span>';
    else if(dl<=7)st='<span class="ts late">zäher Verkehr, +'+dl+' Min</span>';
    else st='<span class="ts bad">Stau, +'+dl+' Min</span>';
    $("drive").innerHTML='<div class="dr"><span class="dt">'+min+' Min</span><span class="dd">'+km+' km</span>'+st+'</div>';
  })
  .catch(function(e){
    $("drive").innerHTML='<div class="tmsg">Verkehrsdaten nicht erreichbar ('+(e&&e.message?e.message:"Fehler")+'). Prüfe Schlüssel und Adressen unter „Einstellungen".</div>';
  });
}

/* ---------- Radio ---------- */
var RADIO = [
  {name:"Antenne Münster", q:"Antenne Münster", must:/M(ü|ue)nster/i},
  {name:"1LIVE", url:"https://wdr-1live-live.icecastssl.wdr.de/wdr/1live/live/mp3/128/stream.mp3"},
  {name:"1LIVE diggi", url:"https://wdr-1live-diggi.icecastssl.wdr.de/wdr/1live/diggi/mp3/128/stream.mp3"},
  {name:"ENERGY", q:"Energy NRW", must:/energy/i}
];

var RB = ["https://de1.api.radio-browser.info","https://de2.api.radio-browser.info","https://fi1.api.radio-browser.info"];
var CUR = -1;
var PENDING = -1;
var REQUESTS = {};

function msg(t){$("rmsg").textContent=t}

function cacheGet(n){
  try{return (JSON.parse(localStorage.getItem("dash.radio")||"{}"))[n]||""}
  catch(e){return ""}
}

function cacheSet(n,u){
  try{
    var o=JSON.parse(localStorage.getItem("dash.radio")||"{}");
    o[n]=u;
    localStorage.setItem("dash.radio",JSON.stringify(o));
  }catch(e){}
}

function mark(){
  RADIO.forEach(function(st,i){
    var b=$("rb"+i);
    if(!b)return;
    b.className="rb"+(i===CUR?" on":"")+(!st.url?" wait":"");
    b.setAttribute("aria-pressed",i===CUR?"true":"false");
  });
}

function rbFind(st,i){
  if(i>=RB.length)return Promise.reject(new Error("Senderverzeichnis nicht erreichbar"));
  return fetch(RB[i]+"/json/stations/byname/"+encodeURIComponent(st.q)+"?hidebroken=true&order=votes&reverse=true&limit=30")
  .then(function(r){if(!r.ok)throw new Error("http");return r.json()})
  .then(function(l){
    var ok=l.filter(function(x){
      return x.countrycode==="DE"&&st.must.test(x.name)&&/^https:/.test(x.url_resolved||"")&&x.lastcheckok===1;
    });
    if(!ok.length){
      var e=new Error("Kein HTTPS-Stream für "+st.name+" gefunden");
      e.final=true;
      throw e;
    }
    return ok[0].url_resolved;
  })
  .catch(function(e){
    if(e&&e.final)throw e;
    return rbFind(st,i+1);
  });
}

function startStation(i){
  var st=RADIO[i],a=$("player");
  if(!st||!st.url){
    PENDING=i;
    msg(st?st.name+": Stream-Adresse wird gesucht …":"");
    return;
  }
  PENDING=-1;
  CUR=i;
  mark();
  msg("Verbinde mit "+st.name+" …");
  a.pause();
  a.src=st.url;
  a.load();
  var pr=a.play();
  if(pr&&pr.catch)pr.catch(function(){
    if(CUR===i){
      msg("Wiedergabe nicht möglich. Prüfe die Internetverbindung und tippe erneut.");
      CUR=-1;
      mark();
    }
  });
}

function resolveStation(st){
  if(REQUESTS[st.name])return REQUESTS[st.name];
  var cached=cacheGet(st.name);
  if(cached&&!st.url){
    st.url=cached;
    mark();
  }
  REQUESTS[st.name]=rbFind(st,0).then(function(u){
    st.url=u;
    cacheSet(st.name,u);
    mark();
    var index=RADIO.indexOf(st);
    if(PENDING===index)msg(st.name+": Stream bereit – bitte zum Starten erneut tippen.");
    return u;
  }).catch(function(e){
    if(!st.url){
      var index=RADIO.indexOf(st);
      if(PENDING===index)PENDING=-1;
      msg(e.message);
      mark();
    }
    throw e;
  }).then(function(v){
    delete REQUESTS[st.name];
    return v;
  },function(e){
    delete REQUESTS[st.name];
    throw e;
  });
  REQUESTS[st.name].catch(function(){});
  return REQUESTS[st.name];
}

function playStation(i){
  var st=RADIO[i],a=$("player");
  if(!st)return;

  if(CUR===i||PENDING===i){
    a.pause();
    a.removeAttribute("src");
    a.load();
    CUR=-1;
    PENDING=-1;
    mark();
    msg("");
    return;
  }

  a.pause();

  if(!st.url){
    PENDING=i;
    CUR=-1;
    mark();
    msg(st.name+": Stream-Adresse wird gesucht …");
    resolveStation(st);
    return;
  }

  startStation(i);
}

function buildRadio(){
  var h="";
  RADIO.forEach(function(st,i){
    h+='<button type="button" class="rb" id="rb'+i+'" onclick="playStation('+i+')">'+st.name+'</button>';
  });
  h+='<button type="button" class="rb" id="air" onclick="airPicker()">AirPlay</button>';
  $("radio").innerHTML=h;

  var a=$("player");
  a.addEventListener("playing",function(){
    if(CUR>=0)msg("Läuft: "+RADIO[CUR].name);
  });
  a.addEventListener("waiting",function(){
    if(CUR>=0)msg("Puffert …");
  });
  a.addEventListener("error",function(){
    if(CUR>=0){
      msg("Stream nicht erreichbar: "+RADIO[CUR].name);
      CUR=-1;
      mark();
    }
  });

  mark();
  RADIO.forEach(function(st){
    if(st.q)resolveStation(st);
  });
}

function airPicker(){
  var a=$("player");
  if(typeof a.webkitShowPlaybackTargetPicker==="function"){
    try{
      a.webkitShowPlaybackTargetPicker();
    }catch(e){
      msg("AirPlay-Auswahl konnte nicht geöffnet werden. Bitte erneut tippen.");
    }
  }else{
    msg("Diese Safari-Version bietet keine AirPlay-Auswahl an. Öffne das Kontrollzentrum und wähle dort „Küche“.");
  }
}

// ===== Start =====
tick();
setInterval(tick,10000);
loadWeather();
setInterval(loadWeather,900000);
loadTrains();
setInterval(loadTrains,300000);
loadCfg();
if(!CFGD)openSetup();
loadDrive();
setInterval(loadDrive,180000);
buildRadio();
</script>
